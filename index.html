    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .ios-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08); }

<body class="bg-slate-50 text-slate-800 antialiased pb-24">

    <!-- Header Cố định -->
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3">
        <div class="max-w-md mx-auto">
            <div class="flex items-center justify-between mb-2">
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">Tra Cứu Giá Panasonic</h1>
                    <p class="text-xs text-slate-500">Quốc Hùng Cần Thơ (10/2026)</p>
                </div>
                <button onclick="openExportModal()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1.5 rounded-lg font-medium transition">
                    ⚙️ Dữ liệu
                </button>
            </div>

            <!-- Ô tìm kiếm -->
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                    🔍
                </span>
                <input type="text" id="searchInput" placeholder="Tìm tên thiết bị, mã sản phẩm..." 
                    class="w-full pl-9 pr-4 py-2.5 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:bg-white transition outline-none">
            </div>

            <!-- Bộ lọc Danh mục & Trạng thái -->
            <div class="flex gap-2 mt-2.5 overflow-x-auto pb-1 no-scrollbar text-xs" id="categoryFilters">
                <button onclick="filterCategory('ALL')" class="cat-btn bg-blue-600 text-white px-3 py-1.5 rounded-full font-medium whitespace-nowrap transition">Tất cả</button>
            </div>
        </div>
    </header>

    <!-- Nội dung danh sách sản phẩm -->
    <main class="max-w-md mx-auto px-4 pt-3">
        <div class="flex justify-between items-center mb-2 px-1">
            <span class="text-xs text-slate-500 font-medium" id="resultCount">Đang tải sản phẩm...</span>
            <div class="flex gap-2 text-xs">
                <select id="statusFilter" onchange="filterProducts()" class="bg-white border border-slate-200 text-slate-600 rounded-lg px-2 py-1 text-xs outline-none">
                    <option value="ALL">Tất cả trạng thái</option>
                    <option value="in_stock">🟢 Còn hàng</option>
                    <option value="out_of_stock">🔴 Hết hàng</option>
                    <option value="discontinued">⚫ Ngưng kinh doanh</option>
                </select>
            </div>
        </div>

        <div id="productList" class="space-y-3">
            <!-- Sản phẩm được render bằng JS -->
        </div>
    </main>

    <!-- Modal Chỉnh sửa Giá / Trạng thái -->
    <div id="editModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-end sm:items-center justify-center sm:p-4 hidden">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-2xl p-5 ios-shadow animate-slide-up">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-900" id="editModalTitle">Cập nhật sản phẩm</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold px-2">✕</button>
            </div>
            <input type="hidden" id="editProductId">
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Tên sản phẩm</label>
                    <input type="text" id="editName" class="w-full bg-slate-100 border rounded-xl px-3 py-2 text-slate-800 font-medium" readonly>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Giá Bán Lẻ Đề Xuất (VNĐ)</label>
                    <input type="number" id="editRetailPrice" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none font-bold text-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Giá Nhập Có VAT (VNĐ)</label>
                    <input type="number" id="editImportPrice" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">Trạng thái sản phẩm</label>
                    <select id="editStatus" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 outline-none">
                        <option value="in_stock">🟢 Còn hàng</option>
                        <option value="out_of_stock">🔴 Hết hàng</option>
                        <option value="discontinued">⚫ Ngưng kinh doanh</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 mt-5">
                <button onclick="closeEditModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium transition">Hủy</button>
                <button onclick="saveProductEdit()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-xl font-medium transition">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- Modal Quản lý dữ liệu -->

        <div class="bg-white w-full max-w-md rounded-2xl p-5 ios-shadow">

        ];

        let products = [];
        let currentCategory = 'ALL';

        // Khởi tạo dữ liệu từ LocalStorage hoặc mặc định
        function initData() {
            const saved = localStorage.getItem('panasonic_prices_2026');
            if (saved) {
                try {
                    products = JSON.parse(saved);
                } catch (e) {
                    products = defaultProducts;
                }
            } else {
                products = defaultProducts;
                saveData();
            }
            renderCategories();
            filterProducts();
        }

        function saveData() {
            localStorage.setItem('panasonic_prices_2026', JSON.stringify(products));
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilters');
            const categories = ['ALL', ...new Set(defaultProducts.map(p => p.category))];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" class="cat-btn px-3 py-1.5 rounded-full font-medium whitespace-nowrap transition ${currentCategory === cat ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                    ${cat === 'ALL' ? 'Tất cả' : cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            filterProducts();
        }

        function filterProducts() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'ALL' || p.category === currentCategory;
                const matchKey = p.name.toLowerCase().includes(keyword) || p.category.toLowerCase().includes(keyword);
                const matchStatus = statusFilter === 'ALL' || p.status === statusFilter;
                return matchCat && matchKey && matchStatus;
            });

            const listEl = document.getElementById('productList');
            document.getElementById('resultCount').innerText = `Hiển thị ${filtered.length} sản phẩm`;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
                        <p class="text-slate-400 text-sm">Không tìm thấy sản phẩm phù hợp.</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = filtered.map(p => {
                let statusBadge = '';
                if (p.status === 'in_stock') statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-50 text-emerald-700">🟢 Còn hàng</span>';
                else if (p.status === 'out_of_stock') statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-rose-50 text-rose-700">🔴 Hết hàng</span>';
                else statusBadge = '<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-slate-100 text-slate-600">⚫ Ngưng KD</span>';

                return `
                    <div class="bg-white rounded-2xl p-4 border border-slate-200/80 ios-shadow flex flex-col justify-between gap-2 relative">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <span class="text-[10px] font-semibold text-blue-600 uppercase tracking-wide">${p.category}</span>
                                <h3 class="font-semibold text-slate-900 text-sm mt-0.5 leading-snug">${p.name}</h3>
                            </div>
                            <div>${statusBadge}</div>
                        </div>
                        
                        <div class="flex items-end justify-between mt-1 pt-2 border-t border-slate-100">
                            <div>
                                <div class="text-[10px] text-slate-400 font-medium">GIÁ BÁN LẺ ĐỀ XUẤT</div>
                                <div class="text-lg font-bold text-blue-600 tracking-tight">${formatMoney(p.retailPrice)}</div>
                                <div class="text-xs text-slate-400 font-normal">Giá nhập: <span class="text-slate-500 font-medium">${formatMoney(p.importPrice)}</span></div>
                            </div>
                            <button onclick="openEditModal(${p.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold transition active:scale-95">
                                ✏️ Sửa giá
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Tìm kiếm realtime
        document.getElementById('searchInput').addEventListener('input', filterProducts);

        // Modal chỉnh sửa
        function openEditModal(id) {
            const p = products.find(item => item.id === id);
            if (!p) return;

            document.getElementById('editProductId').value = p.id;
            document.getElementById('editName').value = p.name;
            document.getElementById('editRetailPrice').value = p.retailPrice;
            document.getElementById('editImportPrice').value = p.importPrice;
            document.getElementById('editStatus').value = p.status || 'in_stock';

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveProductEdit() {
            const id = parseInt(document.getElementById('editProductId').value);
            const newRetail = parseFloat(document.getElementById('editRetailPrice').value);
            const newImport = parseFloat(document.getElementById('editImportPrice').value);
            const newStatus = document.getElementById('editStatus').value;

            const p = products.find(item => item.id === id);
            if (p) {
                p.retailPrice = isNaN(newRetail) ? p.retailPrice : newRetail;
                p.importPrice = isNaN(newImport) ? p.importPrice : newImport;
                p.status = newStatus;
                saveData();
                filterProducts();
                closeEditModal();
            }
        }

        // Modal dữ liệu
        function openExportModal() {
            document.getElementById('dataModal').classList.remove('hidden');
        }

        function closeExportModal() {
            document.getElementById('dataModal').classList.add('hidden');
        }

        function resetToDefaultData() {
            if (confirm("Bạn có chắc chắn muốn khôi phục lại toàn bộ giá gốc ban đầu?")) {
                products = JSON.parse(JSON.stringify(defaultProducts));
                saveData();
                filterProducts();
                closeExportModal();
            }
        }

        // Khởi chạy khi tải trang
        window.onload = initData;
    </script>
